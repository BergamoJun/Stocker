schema_version: '0.2.0'
access_mode: public_free
default_market: US
default_language: ko
default_horizon: medium
horizons:
  short: '1-3 months'
  medium: '3-12 months'
  long: '1+ years'
required_scenarios: [bull, base, bear]
report_style: detailed
require_source_ids: true
allow_unverified_price_targets: false
allow_unsourced_probability_estimates: false
allow_automated_trade_actions: false
allow_personalized_allocation_advice: false
public_price_display_enabled: false
price_derived_metrics_enabled: false
fred_ai_integration_enabled: false
news_summary_enabled: false
new_reports_per_ip_per_day_proposed: 3
max_concurrent_jobs_proposed: 2
monthly_budget_usd: null
max_report_repair_attempts: 1
freshness:
  quote: 'display explicit exchange session/market timestamp; unsupported until vendor connected'
  fundamentals: 'display latest filing publication date and covered period'
  etf_holdings: 'display issuer snapshot date'
  news: 'display publication and event dates separately'
